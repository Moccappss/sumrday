name: Build & Release Admin Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Prepare .env for Target Switching
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          fi

      - name: Build Both Admin APKs (sumr-day & websiteagenzie)
        run: npm run apk:all

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sumrday-agenzie-admin-apks
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-latest
          name: Admin Android APKs (Latest)
          body: |
            Link download langsung untuk install di HP Android:
            - **sumr.day OS** (`sumrday-admin-debug.apk`)
            - **Agenzie OS** (`agenzie-admin-debug.apk`)
          files: |
            dist-apk/sumrday-admin-debug.apk
            dist-apk/agenzie-admin-debug.apk
          overwrite_files: true
